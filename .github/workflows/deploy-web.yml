name: Deploy Showcase Website to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: web
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YTPMD }}'
          channelId: live
          projectId: ytpmd-1222d
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_YTPMD != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_YTPMD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YTPMD }}
